name: CD - Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo deploy a la vez; el ultimo gana
concurrency:
  group: firebase-hosting
  cancel-in-progress: true

# Minimo privilegio: solo leer el repo y pedir el token OIDC
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Autenticacion sin llaves: Workload Identity Federation (OIDC)
      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Desplegar a Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
